server:
  port: 8082

spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        # Prevent OpenAI audio beans from auto-starting when no OpenAI key is configured.
        speech: none
        transcription: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  web:
    resources:
      cache:
        period: 0
  thymeleaf:
      cache: false

http-llm:
  gemini:
    api-key: ${HTTP_GEMINI_API_KEY}
    model: gemini-3-flash-preview
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    max-tokens: 30000
  mistral:
    api-key: ${MISTRAL_API_KEY}
    model: mistral-medium-latest
    base-url: https://api.mistral.ai/v1/chat/completions
    max-tokens: 30000
  openai:
    # Prefer OPENAI_API_KEY, support HTTP_OPENAI_API_KEY and legacy OPEN_API_KEY, and allow empty for non-OpenAI runs.
    api-key: ${OPENAI_API_KEY:${HTTP_OPENAI_API_KEY:${OPEN_API_KEY:}}}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1/chat/completions
    max-tokens: 16384
  gemma:
    api-key: ${GEMMA_API_KEY:${HTTP_GEMINI_API_KEY:}}
    model: gemma-3-27b-it
    base-url: ${GEMMA_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
    max-tokens: 16384

llm:
  rate-limit:
    # 모든 LLM 호출 정책은 LlmCallPolicy/LlmRequestRateLimiter 에서 이 설정을 공통 사용
    enabled: true
    min-interval-ms: 1000
    max-retries: 3
    initial-backoff-ms: 1000
    max-backoff-ms: 15000

mcp:
  servers:
    search-mcp-server:
      command: ${MCP_NODE_PATH:/opt/homebrew/bin/node}
      args:
        - ${MCP_SEARCH_SERVER_PATH:/Users/dolpaks/Downloads/project/search-mcp-server/src/server.js}
      env:
        PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      capabilities:
        - knowledge-retrieval
      allow-tools: []
    search-economy-index:
      command: ${MCP_ECONOMY_PYTHON_PATH:/Users/dolpaks/Downloads/project/search-economy-index/venv/bin/python}
      args:
        - ${MCP_ECONOMY_SERVER_PATH:/Users/dolpaks/Downloads/project/search-economy-index/run_server.py}
      env:
        PYTHONPATH: ${MCP_ECONOMY_PYTHONPATH:/Users/dolpaks/Downloads/project/search-economy-index/src}
      capabilities:
        - live-data-query
      allow-tools: []
    hanatourApi:
      command: ${MCP_HANATOUR_NODE_PATH:node}
      args:
        - ${MCP_HANATOUR_SERVER_PATH:/Users/dolpaks/Downloads/project/api-mcp-server/src/server.js}
      env: {}
      capabilities:
        - action-execution
      allow-tools: []

prompts:
  system: |
    You are an intelligent and helpful AI assistant.
    Goal: Provide accurate, comprehensive, and high-quality responses.
    Instructions:
    1. Analyze the user's question carefully.
    2. Think step-by-step to ensure logical consistency.
    3. Provide a structured and detailed answer using Markdown.
    4. Be polite and professional.
  agent-system: |
    You are a production Agentic AI assistant.
    Goal: give accurate, concrete, and helpful final answers in Korean.
    Use tools only when needed for realtime or verification. If tool data exists, prioritize it.
    Before tool call, strictly follow inputSchema (exact function/parameter/type, no extra fields).
    If required params are missing, ask one short clarification question instead of guessing.
    For multi-intent queries, split tasks and use multiple tools as needed.
    Never expose chain-of-thought or internal process.
    Avoid shallow/generic replies; include specific facts, numbers, dates, units, and actionable guidance when available.
    If evidence is insufficient, clearly state limits and provide best next step.
    Analyze user intent first.
    Use conversation history only when it is directly relevant to the current user message.
    If the user message is simple greeting/small-talk (e.g., "안녕", "고마워", "잘자"), do not bring unrelated prior history or tool outputs.
    For greeting/small-talk, answer briefly and naturally without unnecessary detail.
  tool-decision: "DECISION RULES: Use tools for: current events, stock prices, web searches, real-time data, news. Use knowledge for: concepts, history, coding, analysis, general facts. IMPORTANT: Answer with ONLY 'YES' or 'NO' - no explanations, no markdown, no extra text."
  tool-choice: |
    CRITICAL TOOL SELECTION RULES:
    0) Default to COMPLETE. Use tools only when strictly required.
    0-1) Use tools ONLY for realtime/changing facts, explicit user request for lookup, or external action execution.
    0-2) For general knowledge/explanations/writing/coding/math/translation, do NOT use tools.
    0-3) If uncertain, return COMPLETE.
    1) Always inspect selected tool inputSchema first.
    2) Use EXACT function name and EXACT parameter names from inputSchema.
    3) Parameter type must match inputSchema exactly (string/number/boolean/list/object).
    4) Do not pass extra parameters not defined in inputSchema.
    5) If a required field is missing, ask user for it instead of guessing.
    6) For ticker tools:
       - search_domestic_ticker.query = company name only (e.g., "삼성전자")
       - get_stock_snapshot.ticker = stock code only (e.g., "005930")
    7) For URL tools, provide url field when required.

    OUTPUT CONTRACT:
    - Return JSON only: {"server":"exact_name","tool":"exact_name","arguments":{...}}
    - If no more tools needed, return: "COMPLETE"
  final-answer: "IMPORTANT: If tool results show empty data (like 'domestic_tickers: []'), DO NOT make up fake information. Instead, acknowledge the limitation and suggest alternative ways to get the information. Use external info + your knowledge. Be clear, cite sources, stay conversational."
  context-aware: "Use context for relevant responses."
