server:
  address: 0.0.0.0
  port: 8082

app:
  redis:
    enabled: true

spring:
  config:
    import:
      - "optional:classpath:systemPrompt.yml"
      - "optional:classpath:mcp.yml"
      - "optional:classpath:a2a-supervisor.yml"
      - "optional:classpath:a2a-supervisor-hitl.yml"
      - "optional:classpath:supervisoSystemPrompt.yml"
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        # Prevent OpenAI audio beans from auto-starting when no OpenAI key is configured.
        speech: none
        transcription: none
    openai:
      api-key: ${http-llm.openai.api-key}
      chat:
        options:
          model: ${http-llm.openai.model:gpt-4o-mini}
          max-tokens: ${http-llm.openai.max-tokens:16384}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  web:
    resources:
      cache:
        period: 0
  thymeleaf:
      cache: false

http-llm:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
    base-url: ${HTTP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    max-tokens: 30000
  gemini-lite:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash-lite
    base-url: ${HTTP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    max-tokens: 30000
  mistral:
    api-key: ${MISTRAL_API_KEY}
    model: mistral-medium-latest
    base-url: https://api.mistral.ai/v1/chat/completions
    max-tokens: 30000
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1/chat/completions
    max-tokens: 16384

llm:
  rate-limit:
    # 모든 LLM 호출 정책은 LlmCallPolicy/LlmRequestRateLimiter 에서 이 설정을 공통 사용
    enabled: true
    min-interval-ms: 1000
    max-retries: 3
    initial-backoff-ms: 1000
    max-backoff-ms: 15000
