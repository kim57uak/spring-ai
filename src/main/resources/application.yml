gemini:
  api-key: ${GEMINI_API_KEY:AIzaSyDpB1EFb4dIBV7oj6QFXooC79q_obrdHMA}
  model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com/v1/models

mcp:
  servers:
    search-mcp-server:
      command: node
      args:
        - /Users/dolpaks/Downloads/project/search-mcp-server/src/server.js
      env:
        PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY: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}
    search-economy-index:
      command: /Users/dolpaks/Downloads/project/search-economy-index/venv/bin/python
      args:
        - /Users/dolpaks/Downloads/project/search-economy-index/run_server.py
      env:
        PYTHONPATH: /Users/dolpaks/Downloads/project/search-economy-index/src

prompts:
  system: "Be helpful, accurate, clear. Think step-by-step."
  tool-decision: "DECISION RULES: Use tools for: current events, stock prices, web searches, real-time data, news. Use knowledge for: concepts, history, coding, analysis, general facts. IMPORTANT: Answer with ONLY 'YES' or 'NO' - no explanations, no markdown, no extra text."
  tool-choice: "CRITICAL: Follow inputSchema exactly - use exact function names, parameter names, and data types. For stock queries: search_domestic_ticker query should be ONLY company name (e.g., \"삼성전자\", NOT \"삼성전자 주가 검색해\"), get_stock_snapshot ticker should be stock code (e.g., \"005930\"). ReAct Format: Thought: [analyze what I need] Action: [choose tool] Observation: [tool result]. Return JSON: {\"server\":\"exact_name\",\"tool\":\"exact_name\"} Or 'COMPLETE' when sufficient data gathered. Extract ONLY the company name from user query for ticker search."
  final-answer: "IMPORTANT: If tool results show empty data (like 'domestic_tickers: []'), DO NOT make up fake information. Instead, acknowledge the limitation and suggest alternative ways to get the information. Use external info + your knowledge. Be clear, cite sources, stay conversational."
  context-aware: "Use context for relevant responses."
