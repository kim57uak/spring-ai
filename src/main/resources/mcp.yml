mcp:
  servers:
    sale-product:
      transport: sse
      host: http://10.225.18.50:8080
      endpoint: /sse
      timeout-ms: 120000
      env: {}
      capabilities:
        - action-execution
      allow-tools:
        - createAutoCopySaleProducts
        - getSaleProductDetails
      tool-policies:
        createAutoCopySaleProducts:
          operation: mutation
          retryable: false
          max-calls-per-request: 1
          require-idempotency-key: true
        getSaleProductDetails:
          operation: query
          retryable: false
          max-calls-per-request: 1
    reservation:
      transport: sse
      host: http://10.225.18.50:8080
      endpoint: /sse
      timeout-ms: 120000
      env: {}
      capabilities:
        - action-execution
      allow-tools:
        - createReservation
      tool-policies:
        createReservation:
          operation: mutation
          retryable: false
          max-calls-per-request: 1
          require-idempotency-key: true
    search-mcp-server:
      transport: stdio
      command: ${MCP_NODE_PATH:/opt/homebrew/bin/node}
      timeout-ms: 120000
      args:
        - ${MCP_SEARCH_SERVER_PATH:/Users/dolpaks/Downloads/project/search-mcp-server/src/server.js}
      env:
        PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      capabilities:
        - knowledge-retrieval
      allow-tools: []
      tool-policies: {}
    search-economy-index:
      transport: stdio
      command: ${MCP_ECONOMY_PYTHON_PATH:/Users/dolpaks/Downloads/project/search-economy-index/venv/bin/python}
      timeout-ms: 120000
      args:
        - ${MCP_ECONOMY_SERVER_PATH:/Users/dolpaks/Downloads/project/search-economy-index/run_server.py}
      env:
        PYTHONPATH: ${MCP_ECONOMY_PYTHONPATH:/Users/dolpaks/Downloads/project/search-economy-index/src}
      capabilities:
        - live-data-query
      allow-tools: []
      tool-policies: {}

agent:
  scopes:
    product:
      allowed-servers:
        - sale-product
      allowed-tools-by-server:
        sale-product:
          - createAutoCopySaleProducts
          - getSaleProductDetails
    reservation:
      allowed-servers:
        - reservation
      allowed-tools-by-server:
        reservation:
          - createReservation
    search:
      allowed-servers:
        - search-mcp-server
      allowed-tools-by-server:
        search-mcp-server: []
