# MCP (Model Context Protocol) 설정
mcp:
  weather:
    host: http://10.225.18.50:8080
    protocol: streamable
    endpoint: /mcp
    reuse-session: true
    cache-tools: true
    allow-legacy-sse-fallback: true
    tools: getWeatherForecastByLocation, getAlerts
  supply-cost:
    host: http://10.225.18.50:8080
    protocol: streamable
    endpoint: /mcp
    reuse-session: true
    cache-tools: true
    allow-legacy-sse-fallback: true
    tools: getSupplyCostInfo
  reservation:
    host: http://10.225.18.50:8080
    protocol: streamable
    endpoint: /mcp
    reuse-session: true
    cache-tools: true
    allow-legacy-sse-fallback: true
    tools: createReservation
  sale-product:
    host: http://10.225.18.50:8080
    protocol: streamable
    endpoint: /mcp
    reuse-session: true
    cache-tools: true
    allow-legacy-sse-fallback: true
    tools: createAutoCopySaleProducts, getSaleProductDetails

  # 로컬 Stdio 서버
  search-mcp-server:
    protocol: stdio
    command: ${MCP_NODE_PATH:/opt/homebrew/bin/node}
    args:
      - ${MCP_SEARCH_SERVER_PATH:/Users/dolpaks/Downloads/project/search-mcp-server/src/server.js}
    env:
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
    timeout-ms: 120000

  search-economy-index:
    protocol: stdio
    command: ${MCP_ECONOMY_PYTHON_PATH:/Users/dolpaks/Downloads/project/search-economy-index/venv/bin/python}
    args:
      - ${MCP_ECONOMY_SERVER_PATH:/Users/dolpaks/Downloads/project/search-economy-index/run_server.py}
    env:
      PYTHONPATH: ${MCP_ECONOMY_PYTHONPATH:/Users/dolpaks/Downloads/project/search-economy-index/src}
    timeout-ms: 120000

agent:
  # scope별 MCP 서버/도구 접근 제어 정책
  scopes:
    product:
      allowed-servers:
        - sale-product
      allowed-tools-by-server:
        sale-product:
          - createAutoCopySaleProducts
          - getSaleProductDetails
    reservation:
      allowed-servers:
        - reservation
      allowed-tools-by-server:
        reservation:
          - createReservation
    search:
      allowed-servers:
        - search-mcp-server
      allowed-tools-by-server:
        search-mcp-server: []

#=============개발서버 설정===============================
---
spring:
  config:
    activate:
      on-profile: dev

# (Dev 서버 IP는 이미 상단에 기본값으로 설정됨)
