<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A Supervisor Console</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg2: #0f1d33;
      --card: #f8fafc;
      --ink: #0f172a;
      --muted: #475569;
      --line: #d8e0ea;
      --brand: #0b6bcb;
      --brand-2: #0284c7;
      --warn: #b91c1c;
      --ok: #166534;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(980px 460px at 15% -20%, #1d3a63 0%, transparent 56%),
        radial-gradient(860px 520px at 92% 120%, #0b3d53 0%, transparent 62%),
        linear-gradient(155deg, var(--bg), var(--bg2));
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .shell {
      width: min(1080px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 28px 60px rgba(2, 12, 24, 0.45);
      animation: rise .45s ease;
    }

    @keyframes rise {
      from { transform: translateY(10px); opacity: .55; }
      to { transform: translateY(0); opacity: 1; }
    }

    .top {
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #eff6ff, #f0f9ff);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .top h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: -.02em;
    }

    .top p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .home {
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 14px;
    }

    .grid {
      padding: 20px;
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 16px;
    }

    .panel-log {
      padding: 16px 0 16px 16px;
    }

    .panel-log h2 {
      padding-right: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
      letter-spacing: -.01em;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 126px;
      resize: vertical;
      line-height: 1.5;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }

    .btn.secondary {
      background: #334155;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: var(--warn); }

    .log {
      max-height: 520px;
      overflow: auto;
      background: #020617;
      color: #e2e8f0;
      border-radius: 12px;
      border: 1px solid #0f172a;
      padding: 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.28) transparent;
    }

    .panel-log .log {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .log::-webkit-scrollbar {
      width: 8px;
    }

    .log::-webkit-scrollbar-track {
      background: transparent;
    }

    .log::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.26);
      border-radius: 999px;
    }

    .log:hover::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.42);
    }

    @media (max-width: 960px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <h1>A2A Supervisor Console</h1>
        <p>`/a2a/supervisor` JSON-RPC 및 stream 이벤트를 직접 테스트합니다.</p>
      </div>
      <a class="home" href="/index.html">Go Hub</a>
    </header>

    <section class="grid">
      <article class="panel">
        <h2>Request Builder</h2>
        <div class="row">
          <div>
            <label for="method">Method</label>
            <select id="method">
              <option value="message/send">message/send</option>
              <option value="message/stream">message/stream</option>
              <option value="tasks/list">tasks/list</option>
              <option value="tasks/get">tasks/get</option>
              <option value="tasks/cancel">tasks/cancel</option>
            </select>
          </div>
          <div>
            <label for="rpcId">Request ID</label>
            <input id="rpcId" value="ui-req-1" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="endpoint">Endpoint</label>
            <input id="endpoint" value="/a2a/supervisor" />
          </div>
          <div>
            <label for="acceptSse">Accept Header</label>
            <select id="acceptSse">
              <option value="auto">auto by method</option>
              <option value="json">application/json</option>
              <option value="sse">text/event-stream</option>
            </select>
          </div>
        </div>

        <label for="params">Params (JSON)</label>
        <textarea id="params">{
  "messageText": "안녕하세요, supervisor 라우팅 테스트",
  "model": "openai"
}</textarea>

        <div class="btns">
          <button class="btn" id="sendBtn">Send</button>
          <button class="btn secondary" id="cancelBtn">Cancel Stream</button>
          <button class="btn secondary" id="clearBtn">Clear Log</button>
        </div>
        <div id="status" class="status"></div>
      </article>

      <article class="panel panel-log">
        <h2>Response / Event Log</h2>
        <div id="log" class="log"></div>
      </article>
    </section>
  </main>

  <script>
    const methodEl = document.getElementById('method');
    const rpcIdEl = document.getElementById('rpcId');
    const endpointEl = document.getElementById('endpoint');
    const acceptEl = document.getElementById('acceptSse');
    const paramsEl = document.getElementById('params');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const sendBtn = document.getElementById('sendBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const clearBtn = document.getElementById('clearBtn');

    let activeAbort = null;

    const presets = {
      "message/send": { messageText: "안녕하세요, supervisor 라우팅 테스트", model: "openai" },
      "message/stream": { messageText: "스트리밍 응답 테스트", model: "openai" },
      "tasks/list": { limit: 20 },
      "tasks/get": { id: "sup-task-xxxx" },
      "tasks/cancel": { id: "sup-task-xxxx", reason: "manual cancel from UI" }
    };

    function pretty(value) {
      return JSON.stringify(value, null, 2);
    }

    function log(message) {
      logEl.textContent += message + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function resolveAccept(method) {
      const mode = acceptEl.value;
      if (mode === 'json') return 'application/json';
      if (mode === 'sse') return 'text/event-stream';
      return method === 'message/stream' ? 'text/event-stream' : 'application/json';
    }

    function parseParams(text) {
      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error("Params JSON 파싱 실패: " + err.message);
      }
    }

    methodEl.addEventListener('change', () => {
      paramsEl.value = pretty(presets[methodEl.value] || {});
    });

    clearBtn.addEventListener('click', () => {
      logEl.textContent = "";
      setStatus("로그를 정리했습니다.", "ok");
    });

    cancelBtn.addEventListener('click', () => {
      if (activeAbort) {
        activeAbort.abort();
        activeAbort = null;
        setStatus("스트림 요청을 취소했습니다.", "ok");
      }
    });

    sendBtn.addEventListener('click', async () => {
      const method = methodEl.value;
      const accept = resolveAccept(method);
      const endpoint = endpointEl.value || '/a2a/supervisor';
      const requestId = rpcIdEl.value || `ui-${Date.now()}`;

      let params;
      try {
        params = parseParams(paramsEl.value);
      } catch (error) {
        setStatus(error.message, "err");
        return;
      }

      const payload = { jsonrpc: "2.0", id: requestId, method, params };
      log(`[request] ${new Date().toISOString()}\n${pretty(payload)}\n`);
      setStatus("요청 전송 중...", "");

      if (activeAbort) {
        activeAbort.abort();
      }
      activeAbort = new AbortController();

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': accept
          },
          body: JSON.stringify(payload),
          signal: activeAbort.signal
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status} ${res.statusText}\n${text}`);
        }

        if (accept !== 'text/event-stream') {
          const json = await res.json();
          log(`[response] ${pretty(json)}\n`);
          setStatus("요청 완료", "ok");
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        setStatus("스트리밍 수신 중...", "");
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            const lines = chunk.split("\n");
            let event = "message";
            let data = "";
            for (const line of lines) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              if (line.startsWith("data:")) data += line.slice(5).trim();
            }
            if (data) {
              log(`[event:${event}] ${data}`);
            }
          }
        }
        setStatus("스트리밍 완료", "ok");
      } catch (error) {
        if (error.name === 'AbortError') {
          log("[stream] aborted by user");
          setStatus("스트림 취소됨", "ok");
        } else {
          log(`[error] ${error.message}`);
          setStatus(error.message, "err");
        }
      } finally {
        activeAbort = null;
      }
    });
  </script>
</body>
</html>
