<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A Supervisor Console</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --surface-elevated: #ffffff;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--text-primary);
      background: var(--bg-primary);
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .shell {
      width: min(1200px, 100%);
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: rise .3s ease;
    }

    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .top {
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border-light);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      box-shadow: var(--shadow-md);
      font-size: 24px;
    }

    .top h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .top p {
      margin: 2px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 400;
    }

    .home {
      text-decoration: none;
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      color: var(--text-primary);
      background: var(--bg-secondary);
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .home:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    .grid {
      padding: 24px 32px;
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      border: 1px solid var(--border-light);
      border-radius: 12px;
      background: var(--surface-elevated);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .panel-log {
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      background: var(--bg-secondary);
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
      font-family: "SF Mono", "Consolas", "Monaco", monospace;
      font-size: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--accent-primary);
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      color: white;
      background: var(--accent-primary);
      transition: all 0.2s;
      box-shadow: var(--shadow-md);
    }

    .btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: var(--shadow-lg);
    }

    .btn.secondary {
      background: var(--bg-secondary);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      min-height: 20px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--bg-primary);
    }

    .status.ok {
      color: var(--success);
      background: #ecfdf5;
    }

    .status.err {
      color: var(--error);
      background: #fef2f2;
    }

    .status.pending {
      color: #92400e;
      background: #fffbeb;
    }

    .log {
      max-height: 520px;
      overflow: auto;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      padding: 16px;
      font-family: "SF Mono", "Consolas", "Monaco", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      scrollbar-width: thin;
      scrollbar-color: var(--border-medium) transparent;
    }

    .log::-webkit-scrollbar {
      width: 10px;
    }

    .log::-webkit-scrollbar-track {
      background: transparent;
    }

    .log::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 5px;
      border: 2px solid #1e293b;
    }

    .log:hover::-webkit-scrollbar-thumb {
      background: var(--text-muted);
    }

    @media (max-width: 960px) {
      body {
        padding: 12px;
      }

      .top {
        padding: 16px 20px;
      }

      .grid {
        padding: 16px 20px;
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="title">
        <div class="logo">⚙️</div>
        <div>
          <h1>A2A Supervisor Console</h1>
          <p>`/a2a/supervisor` JSON-RPC 및 stream 이벤트를 직접 테스트합니다.</p>
        </div>
      </div>
      <a class="home" href="/index.html">홈</a>
    </header>

    <section class="grid">
      <article class="panel">
        <h2>Request Builder</h2>
        <div class="row">
          <div>
            <label for="method">Method</label>
            <select id="method">
              <option value="message/send">message/send</option>
              <option value="message/stream">message/stream</option>
              <option value="tasks/list">tasks/list</option>
              <option value="tasks/get">tasks/get</option>
              <option value="tasks/cancel">tasks/cancel</option>
            </select>
          </div>
          <div>
            <label for="rpcId">Request ID</label>
            <input id="rpcId" value="ui-req-1" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="endpoint">Endpoint</label>
            <input id="endpoint" value="/a2a/supervisor" />
          </div>
          <div>
            <label for="acceptSse">Accept Header</label>
            <select id="acceptSse">
              <option value="auto">auto by method</option>
              <option value="json">application/json</option>
              <option value="sse">text/event-stream</option>
            </select>
          </div>
        </div>

        <label for="params">Params (JSON)</label>
        <textarea id="params">{
  "messageText": "안녕하세요, supervisor 라우팅 테스트",
  "model": "openai"
}</textarea>

        <div class="btns">
          <button class="btn" id="sendBtn">Send</button>
          <button class="btn secondary" id="cancelBtn">Cancel Stream</button>
          <button class="btn secondary" id="clearBtn">Clear Log</button>
        </div>
        <div id="status" class="status"></div>
      </article>

      <article class="panel panel-log">
        <h2>Response / Event Log</h2>
        <div id="log" class="log"></div>
      </article>
    </section>
  </main>

  <script>
    const methodEl = document.getElementById('method');
    const rpcIdEl = document.getElementById('rpcId');
    const endpointEl = document.getElementById('endpoint');
    const acceptEl = document.getElementById('acceptSse');
    const paramsEl = document.getElementById('params');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const sendBtn = document.getElementById('sendBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const clearBtn = document.getElementById('clearBtn');

    let activeAbort = null;

    const presets = {
      "message/send": { messageText: "안녕하세요, supervisor 라우팅 테스트", model: "openai" },
      "message/stream": { messageText: "스트리밍 응답 테스트", model: "openai" },
      "tasks/list": { limit: 20 },
      "tasks/get": { id: "sup-task-xxxx" },
      "tasks/cancel": { id: "sup-task-xxxx", reason: "manual cancel from UI" }
    };

    function pretty(value) {
      return JSON.stringify(value, null, 2);
    }

    function log(message) {
      logEl.textContent += message + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function parseSupervisorProgress(line) {
      const pattern = /^\[supervisor\]\s+\[([^\]]+)\]\s+\[(\d+)%\]\s+(.+?)(?:\s+\{(.+)\})?$/;
      const match = String(line || '').match(pattern);
      if (!match) return null;

      const [, stage, progress, message, metadataStr] = match;
      const metadata = {};
      if (metadataStr) {
        metadataStr.split(',').forEach((entry) => {
          const pair = entry.trim();
          if (!pair) return;
          const separatorIndex = pair.indexOf('=');
          if (separatorIndex < 0) return;
          const key = pair.slice(0, separatorIndex).trim();
          const value = pair.slice(separatorIndex + 1).trim();
          if (key) metadata[key] = value;
        });
      }

      return {
        stage,
        progress: Number(progress),
        message,
        metadata
      };
    }

    function getStageLabel(stage) {
      const labels = {
        hitl: "HITL 평가",
        hitl_waiting: "검토 대기",
        completed: "완료",
        error: "오류"
      };
      return labels[String(stage || '').toLowerCase()] || String(stage || '');
    }

    function applyProgressStatus(progress) {
      if (!progress) return false;
      const stage = String(progress.stage || '').toLowerCase();
      if (stage === 'hitl_waiting' || String(progress.metadata?.reviewStatus || '').toUpperCase() === 'WAITING_REVIEW') {
        setStatus(`HITL 승인 대기 (100%) · ${progress.message}`, "pending");
        return true;
      }
      if (stage === 'completed') {
        setStatus(`${getStageLabel(stage)} (${progress.progress}%) · ${progress.message}`, "ok");
        return false;
      }
      if (stage === 'error') {
        setStatus(`${getStageLabel(stage)} (${progress.progress}%) · ${progress.message}`, "err");
        return false;
      }
      setStatus(`${getStageLabel(stage)} (${progress.progress}%) · ${progress.message}`);
      return false;
    }

    function resolveAccept(method) {
      const mode = acceptEl.value;
      if (mode === 'json') return 'application/json';
      if (mode === 'sse') return 'text/event-stream';
      return method === 'message/stream' ? 'text/event-stream' : 'application/json';
    }

    function parseParams(text) {
      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error("Params JSON 파싱 실패: " + err.message);
      }
    }

    methodEl.addEventListener('change', () => {
      paramsEl.value = pretty(presets[methodEl.value] || {});
    });

    clearBtn.addEventListener('click', () => {
      logEl.textContent = "";
      setStatus("로그를 정리했습니다.", "ok");
    });

    cancelBtn.addEventListener('click', () => {
      if (activeAbort) {
        activeAbort.abort();
        activeAbort = null;
        setStatus("스트림 요청을 취소했습니다.", "ok");
      }
    });

    sendBtn.addEventListener('click', async () => {
      const method = methodEl.value;
      const accept = resolveAccept(method);
      const endpoint = endpointEl.value || '/a2a/supervisor';
      const requestId = rpcIdEl.value || `ui-${Date.now()}`;

      let params;
      try {
        params = parseParams(paramsEl.value);
      } catch (error) {
        setStatus(error.message, "err");
        return;
      }

      const payload = { jsonrpc: "2.0", id: requestId, method, params };
      log(`[request] ${new Date().toISOString()}\n${pretty(payload)}\n`);
      setStatus("요청 전송 중...", "");

      if (activeAbort) {
        activeAbort.abort();
      }
      activeAbort = new AbortController();

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': accept
          },
          body: JSON.stringify(payload),
          signal: activeAbort.signal
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`HTTP ${res.status} ${res.statusText}\n${text}`);
        }

        if (accept !== 'text/event-stream') {
          const json = await res.json();
          log(`[response] ${pretty(json)}\n`);
          setStatus("요청 완료", "ok");
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let hitlWaitingDetected = false;
        setStatus("스트리밍 수신 중...", "");
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            const lines = chunk.split("\n");
            let event = "message";
            let data = "";
            for (const line of lines) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              if (line.startsWith("data:")) data += line.slice(5).trim();
            }
            if (data) {
              let payload = data;
              try {
                payload = JSON.parse(data);
              } catch (e) {
                // no-op: JSON이 아니면 원문 사용
              }
              log(`[event:${event}] ${payload}`);

              if (event === 'chunk') {
                const payloadText = String(payload);
                const lines = payloadText.split('\n');
                for (const rawLine of lines) {
                  const progress = parseSupervisorProgress(rawLine.trim());
                  if (!progress) continue;
                  if (applyProgressStatus(progress)) {
                    hitlWaitingDetected = true;
                  }
                }
              }
            }
          }
        }
        if (!hitlWaitingDetected) {
          setStatus("스트리밍 완료", "ok");
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          log("[stream] aborted by user");
          setStatus("스트림 취소됨", "ok");
        } else {
          log(`[error] ${error.message}`);
          setStatus(error.message, "err");
        }
      } finally {
        activeAbort = null;
      }
    });
  </script>
</body>
</html>
