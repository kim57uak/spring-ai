<!DOCTYPE html>
<html>
<head>
    <title>Gemini Chat</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #2e2e2e;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            text-align: center;
            color: #f0f0f0;
            margin: 20px 0;
            flex-shrink: 0;
        }
        
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #3a3a3a;
            margin: 0 20px;
            border-radius: 8px 8px 0 0;
            border: 1px solid #555;
            border-bottom: none;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: #3a3a3a;
            margin: 0 20px 20px;
            border-radius: 0 0 8px 8px;
            border: 1px solid #555;
            border-top: none;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
            background: #404040;
            color: #e0e0e0;
        }
        
        button {
            padding: 12px 20px;
            background: #666;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background: #777;
        }
        
        .user-msg {
            background: #4a4a4a;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-align: right;
            border-left: 3px solid #888;
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        .ai-msg {
            background: #505050;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 3px solid #999;
            word-wrap: break-word;
            line-height: 1.5;
        }
        
        .ai-msg h1, .ai-msg h2, .ai-msg h3 {
            color: #f0f0f0;
            margin: 10px 0;
        }
        
        .ai-msg strong {
            color: #ffd700;
            font-weight: bold;
        }
        
        .ai-msg em {
            color: #87ceeb;
            font-style: italic;
        }
        
        .ai-msg code {
            background: #2a2a2a;
            color: #ff6b6b;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        .ai-msg pre {
            background: #2a2a2a;
            color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .ai-msg ul, .ai-msg ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .ai-msg blockquote {
            border-left: 3px solid #666;
            margin: 10px 0;
            padding-left: 15px;
            color: #ccc;
        }
        
        .ai-msg table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            background: #404040;
        }
        
        .ai-msg th, .ai-msg td {
            border: 1px solid #666;
            padding: 8px 12px;
            text-align: left;
        }
        
        .ai-msg th {
            background: #555;
            color: #f0f0f0;
            font-weight: bold;
        }
        
        .ai-msg td {
            color: #e0e0e0;
        }
        
        .ai-msg pre code {
            background: transparent;
            color: #f0f0f0;
            padding: 0;
        }
        
        .user-msg strong { color: #bbb; }
        .ai-msg strong { color: #ccc; }
        
        .mermaid {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .MathJax {
            color: #e0e0e0 !important;
        }
        
        mjx-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            padding: 5px 10px;
            margin: 5px 0;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Gemini 2.5 Flash Chat</h1>
    
    <div id="chatArea"></div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요...">
        <button onclick="sendMessage()">전송</button>
    </div>
    
    <script>
        // MathJax 설정
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
        
        // Mermaid 초기화
        mermaid.initialize({ theme: 'dark' });
        
        let isStreaming = false;
        let scrollPending = false;
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const decoder = new TextDecoder();
        
        // 고성능 스크롤 최적화
        function scheduleScroll() {
            if (scrollPending) return;
            scrollPending = true;
            requestAnimationFrame(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
                scrollPending = false;
            });
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isStreaming) return;
            
            isStreaming = true;
            messageInput.value = '';
            
            // 사용자 메시지
            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            userDiv.textContent = `You: ${message}`;
            chatArea.appendChild(userDiv);
            
            // AI 메시지
            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            aiDiv.innerHTML = '<strong>Gemini:</strong> ';
            const aiContent = document.createElement('span');
            aiDiv.appendChild(aiContent);
            chatArea.appendChild(aiDiv);
            scheduleScroll();
            
            let markdownBuffer = '';
            
            const abortController = new AbortController();
            
            fetch('/api/stream/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message }),
                signal: abortController.signal
            })
            .then(response => {
                if (!response.ok) throw new Error('Network error');
                
                const reader = response.body.getReader();
                let textBuffer = '';
                let updateCount = 0;
                
                function readStream() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            if (markdownBuffer) {
                                const finalHtml = marked.parse(markdownBuffer);
                                aiContent.innerHTML = finalHtml;
                                
                                // 최종 Mermaid 렌더링
                                console.log('Final HTML:', finalHtml);
                                const mermaidElements = aiContent.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
                                console.log('Found mermaid elements:', mermaidElements.length);
                                mermaidElements.forEach((el, index) => {
                                    console.log(`Mermaid ${index}:`, el.textContent);
                                    const mermaidDiv = document.createElement('div');
                                    mermaidDiv.className = 'mermaid';
                                    mermaidDiv.textContent = el.textContent;
                                    el.parentNode.replaceChild(mermaidDiv, el);
                                });
                                if (mermaidElements.length > 0) {
                                    console.log('Running mermaid.run()');
                                    mermaid.run().then(() => console.log('Mermaid rendered')).catch(err => console.error('Mermaid error:', err));
                                }
                                
                                // 최종 MathJax 렌더링
                                if (window.MathJax) {
                                    MathJax.typesetPromise([aiContent]).catch(err => console.log(err));
                                }
                                
                                scheduleScroll();
                            }
                            isStreaming = false;
                            return;
                        }
                        
                        const rawText = decoder.decode(value, { stream: true });
                        
                        const text = decoder.decode(value, { stream: true });
                        if (text) {
                            markdownBuffer += text;
                            // 기본 마크다운만 렌더링 (Mermaid/MathJax는 완료 후)
                            const renderedHtml = marked.parse(markdownBuffer);
                            aiContent.innerHTML = renderedHtml;
                            scheduleScroll();
                        }
                        
                        return readStream();
                    });
                }
                
                return readStream();
            })
            .catch(error => {
                isStreaming = false;
                if (error.name !== 'AbortError') {
                    aiDiv.textContent = 'Gemini: 연결 오류';
                }
            });
        }
        
        messageInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 초기 포커스
        messageInput.focus();
    </script>
</body>
</html>
