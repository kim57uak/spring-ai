<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --surface-elevated: #ffffff;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            line-height: 1.6;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        /* Header */
        .topbar {
            background: var(--surface-elevated);
            border-bottom: 1px solid var(--border-light);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: var(--shadow-md);
            font-size: 24px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
        }

        select, textarea, button {
            font-family: inherit;
        }

        #model-select {
            border: 1px solid var(--border-medium);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 10px 16px;
            min-width: 180px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        #model-select:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        #model-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            border: 1px solid var(--border-medium);
            border-radius: 8px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        .btn-clear {
            background: var(--bg-secondary);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
        }

        .btn-clear:hover {
            background: var(--bg-primary);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            width: 100%;
            max-width: none;
            margin: 0;
        }

        #chat-container::-webkit-scrollbar {
            width: 10px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 5px;
            border: 2px solid var(--bg-primary);
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .message {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            background: var(--bg-secondary);
            font-size: 20px;
            box-shadow: var(--shadow-sm);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
        }

        .bubble {
            max-width: 100%;
            border-radius: 12px;
            padding: 18px 24px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-light);
            line-height: 1.7;
            font-size: 15px;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .user .bubble {
            background: var(--surface-elevated);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.1), var(--shadow-sm);
        }

        .bubble p {
            margin: 0.5em 0;
        }

        .bubble pre {
            background: #f1f5f9;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow-x: auto;
            padding: 16px;
            margin: 12px 0;
        }

        .bubble code {
            background: #f1f5f9;
            border-radius: 4px;
            padding: 3px 7px;
            font-size: 0.9em;
            font-family: "SF Mono", "Consolas", "Monaco", monospace;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
            border: none;
        }

        /* Markdown Lists */
        .bubble ul, .bubble ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .bubble ul {
            list-style-type: disc;
        }

        .bubble ol {
            list-style-type: decimal;
        }

        .bubble li {
            margin: 6px 0;
            line-height: 1.7;
        }

        .bubble li > ul,
        .bubble li > ol {
            margin: 6px 0;
            padding-left: 24px;
        }

        .bubble ul ul {
            list-style-type: circle;
        }

        .bubble ul ul ul {
            list-style-type: square;
        }

        /* Markdown Paragraphs */
        .bubble p {
            margin: 10px 0;
        }

        .bubble p:first-child {
            margin-top: 0;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        /* Markdown Headings */
        .bubble h1, .bubble h2, .bubble h3,
        .bubble h4, .bubble h5, .bubble h6 {
            margin: 16px 0 8px 0;
            font-weight: 600;
            line-height: 1.3;
        }

        .bubble h1 { font-size: 1.5em; }
        .bubble h2 { font-size: 1.3em; }
        .bubble h3 { font-size: 1.1em; }
        .bubble h4, .bubble h5, .bubble h6 { font-size: 1em; }

        /* Markdown Blockquote */
        .bubble blockquote {
            margin: 12px 0;
            padding: 8px 16px;
            border-left: 3px solid var(--border-light);
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-secondary);
        }

        /* Markdown Tables */
        .bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }

        .bubble table th,
        .bubble table td {
            border: 1px solid var(--border-light);
            padding: 8px 12px;
            text-align: left;
        }

        .bubble table th {
            background: rgba(0, 0, 0, 0.03);
            font-weight: 600;
        }

        .agent-trace {
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: #f8fafc;
            overflow: hidden;
        }

        .agent-trace summary {
            cursor: pointer;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: all 0.2s ease;
            list-style: none;
        }

        .agent-trace summary::-webkit-details-marker {
            display: none;
        }

        .agent-trace summary:hover {
            background: var(--bg-secondary);
        }

        .agent-trace summary::before {
            content: '▾';
            font-size: 12px;
            color: var(--accent-primary);
        }

        .agent-trace-body {
            border-top: 1px solid var(--border-light);
            padding: 16px 20px;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .agent-answer {
            padding: 0;
        }

        /* Input Area */
        .input-wrap {
            background: var(--surface-elevated);
            border-top: 1px solid var(--border-light);
            padding: 24px 32px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 1000px;
            margin: 0 auto;
        }

        #prompt-input {
            flex: 1;
            min-height: 56px;
            max-height: 200px;
            resize: vertical;
            border: 1px solid var(--border-medium);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            font-size: 15px;
            line-height: 1.5;
            transition: all 0.2s;
        }

        #prompt-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #prompt-input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            color: white;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            height: 56px;
            min-width: 90px;
        }

        .btn-send:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: var(--shadow-lg);
        }

        .hint {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Mermaid Diagrams */
        .mermaid-diagram {
            margin: 16px 0;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            overflow-x: auto;
            text-align: center;
        }

        .mermaid-diagram svg {
            max-width: 100%;
            height: auto;
        }

        /* Math Equations */
        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0;
        }

        .katex {
            font-size: 1.1em;
            color: var(--text-primary) !important;
        }

        .katex .base {
            color: var(--text-primary);
        }

        /* Inline math */
        .bubble p .katex {
            display: inline-block;
            vertical-align: middle;
        }

        /* Block math */
        .bubble .katex-display > .katex {
            display: block;
            text-align: center;
        }

        /* Status Layer (Progress Indicator) */
        #status-layer {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        #status-layer.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #status-layer.complete {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        .status-spinner {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: relative;
            background: transparent;
            border: 2px solid var(--accent-primary);
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-check {
            display: none;
            font-size: 18px;
            color: var(--success);
        }

        #status-layer.complete .status-spinner {
            display: none;
        }

        #status-layer.complete .status-check {
            display: block;
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .topbar {
                padding: 12px 16px;
            }

            #chat-container {
                padding: 20px 16px;
                gap: 16px;
            }

            .bubble {
                padding: 12px 16px;
                font-size: 14px;
            }

            .input-wrap {
                padding: 16px;
            }

            .input-row {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
            }

            #model-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="title">
            <div class="logo">💬</div>
            <div>
                <h1 id="page-title">Spring AI Chat</h1>
                <div class="subtitle" id="page-hint">Spring AI • Streaming Chat</div>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <select id="model-select">
                <optgroup label="Configured Providers">
                    <option value="mistral">Mistral</option>
                    <option value="mistral-large">Mistral Large</option>
                    <option value="gemini">Gemini</option>
                    <option value="gemini-lite">Gemini Lite</option>
                    <option value="openai">OpenAI</option>
                </optgroup>
                <optgroup label="Model Aliases">
                    <option value="mistral-medium-latest">Mistral Medium Latest</option>
                    <option value="mistral-large-latest">Mistral Large Latest</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                </optgroup>
            </select>
            <button class="btn btn-clear" type="button" id="clear-history-btn">초기화</button>
            <a class="btn" href="/index.html">홈</a>
        </div>
    </header>

    <section id="chat-container">
        <div class="message ai">
            <div class="avatar">🤖</div>
            <div class="bubble">안녕하세요. 메시지를 입력하면 AI가 실시간으로 응답합니다.</div>
        </div>
    </section>

    <section class="input-wrap">
        <div class="input-row">
            <textarea id="prompt-input" placeholder="메시지를 입력하세요... (Enter: 전송 / Shift+Enter: 줄바꿈)"></textarea>
            <button class="btn btn-send" type="button" id="send-btn">전송</button>
        </div>
    </section>

    <!-- Status Layer -->
    <div id="status-layer">
        <div class="status-spinner"></div>
        <div class="status-check">✓</div>
        <div class="status-text" id="status-text">Processing...</div>
    </div>
</div>

<script>
    let streaming = false;
    const query = new URLSearchParams(window.location.search);
    const apiBase = query.get('apiBase') || '/api/http-chat';
    const transport = query.get('transport') || 'rest';
    const a2aEndpoint = query.get('a2aEndpoint') || '/a2a/supervisor/stream';
    const pageTitle = query.get('title') || 'Spring AI Chat';
    const pageHint = query.get('hint') || 'Spring AI • Streaming Chat';
    const pageTitleElement = document.getElementById('page-title');
    const pageHintElement = document.getElementById('page-hint');
    if (pageTitleElement) {
        pageTitleElement.textContent = pageTitle;
    }
    if (pageHintElement) {
        pageHintElement.textContent = pageHint;
    }
    document.title = pageTitle;

    // Set logo emoji based on title
    const logoEl = document.querySelector('.logo');
    if (pageTitle.includes('Product')) {
        logoEl.textContent = '📦';
    } else if (pageTitle.includes('Reservation')) {
        logoEl.textContent = '📅';
    } else if (pageTitle.includes('Search')) {
        logoEl.textContent = '🔍';
    }

    // Marked 설정
    marked.setOptions({
        gfm: true,
        breaks: true,
        pedantic: false,
        sanitize: false,
        smartLists: true,
        smartypants: false
    });

    // Mermaid 초기화
    mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        themeVariables: {
            primaryColor: '#3b82f6',
            primaryTextColor: '#1e293b',
            primaryBorderColor: '#cbd5e1',
            lineColor: '#64748b',
            secondaryColor: '#8b5cf6',
            tertiaryColor: '#f8f9fa',
            background: '#ffffff',
            mainBkg: '#f8f9fa',
            secondBkg: '#e2e8f0',
            textColor: '#1e293b',
            fontSize: '13px'
        }
    });

    // KaTeX 렌더링 함수
    function renderMath(element) {
        if (!element || !window.renderMathInElement) {
            console.warn('KaTeX not available');
            return;
        }
        try {
            renderMathInElement(element, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
            console.log('KaTeX renderMathInElement called with custom delimiters');
        } catch (e) {
            console.error('KaTeX render error:', e);
        }
    }

    // Mermaid 렌더링 함수
    async function renderMermaid(element) {
        if (!element) return;
        const mermaidBlocks = element.querySelectorAll('code.language-mermaid, pre > code:not([class])');
        for (let i = 0; i < mermaidBlocks.length; i++) {
            const block = mermaidBlocks[i];
            const code = block.textContent;

            // Mermaid 코드인지 확인
            if (!code.trim().match(/^(graph|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|journey|gitGraph|flowchart)/)) {
                continue;
            }

            try {
                const id = `mermaid-${Date.now()}-${i}`;
                const { svg } = await mermaid.render(id, code);
                const wrapper = document.createElement('div');
                wrapper.className = 'mermaid-diagram';
                wrapper.innerHTML = svg;
                block.parentElement.replaceWith(wrapper);
            } catch (e) {
                console.warn('Mermaid render error:', e);
            }
        }
    }

    function selectedModelKey() {
        const modelSelect = document.getElementById('model-select');
        if (!modelSelect) return 'mistral';

        if (transport === 'a2a-supervisor') {
            const value = (modelSelect.value || '').toLowerCase();
            if (!value || value === 'openai') return 'gpt-4o-mini';
            if (value.includes('gpt-') || value.startsWith('o1') || value.startsWith('o3') || value.startsWith('o4')) {
                return modelSelect.value;
            }
            return 'gpt-4o-mini';
        }

        const value = (modelSelect.value || '').toLowerCase();
        if (value.includes('mistral-large') || value === 'mistral-large') return 'mistral-large-latest';
        if (value.includes('flash-lite') || value === 'gemini-lite') return 'gemini-lite';
        if (value.includes('gemini')) return 'gemini';
        if (value.includes('openai') || value.includes('gpt')) return 'openai';
        if (value.includes('mistral')) return 'mistral';
        return 'mistral';
    }

    function splitTraceAndAnswer(rawText) {
        const source = rawText || '';
        const traceHeader = '[생각의 과정 요약]';
        if (!source.includes(traceHeader)) {
            return { traceMarkdown: '', answerMarkdown: source };
        }

        const lines = source.split(/\r?\n/);
        const traceLines = [];
        const answerLines = [];

        let inTrace = false;
        let sawSelectedTools = false;
        let traceClosed = false;

        const isToolLine = (line) => {
            const trimmed = line.trim();
            return trimmed.startsWith('-')
                    || trimmed.startsWith('없음')
                    || trimmed.includes('args=')
                    || trimmed.includes('/');
        };

        for (const line of lines) {
            const trimmed = line.trim();
            if (!inTrace && !traceClosed && trimmed.startsWith(traceHeader)) {
                inTrace = true;
            }

            if (inTrace && !traceClosed) {
                traceLines.push(line);
                if (trimmed.startsWith('[선택된 도구]')) {
                    sawSelectedTools = true;
                    continue;
                }
                if (sawSelectedTools && trimmed && !trimmed.startsWith('[') && !isToolLine(line)) {
                    traceLines.pop();
                    answerLines.push(line);
                    traceClosed = true;
                    inTrace = false;
                }
                continue;
            }

            answerLines.push(line);
        }

        return {
            traceMarkdown: traceLines.join('\n').trim(),
            answerMarkdown: answerLines.join('\n').trim()
        };
    }

    function renderStreamMessage(target, markdownText, traceState) {
        const existingTrace = target.querySelector('.agent-trace');
        if (existingTrace) {
            traceState.open = existingTrace.open;
        }

        const parts = splitTraceAndAnswer(markdownText);
        const hasTrace = !!parts.traceMarkdown;
        const hasAnswer = !!parts.answerMarkdown;

        if (hasAnswer && !traceState.autoCollapsed && !traceState.userInteracted) {
            traceState.open = false;
            traceState.autoCollapsed = true;
        }

        // 수식을 임시 플레이스홀더로 보호
        let answerText = parts.answerMarkdown;
        const mathBlocks = [];
        const mathInlines = [];

        // 블록 수식 보호 (\[...\] 및 $$...$$)
        answerText = answerText.replace(/\\\[([\s\S]*?)\\\]/g, (match, content) => {
            mathBlocks.push(content);
            return `MATHBLOCK${mathBlocks.length - 1}MATHBLOCK`;
        });
        answerText = answerText.replace(/\$\$([\s\S]*?)\$\$/g, (match, content) => {
            mathBlocks.push(content);
            return `MATHBLOCK${mathBlocks.length - 1}MATHBLOCK`;
        });

        // 인라인 수식 보호 (\(...\) 및 $...$)
        answerText = answerText.replace(/\\\((.*?)\\\)/g, (match, content) => {
            mathInlines.push(content);
            return `MATHINLINE${mathInlines.length - 1}MATHINLINE`;
        });
        answerText = answerText.replace(/\$([^\$\n]+?)\$/g, (match, content) => {
            mathInlines.push(content);
            return `MATHINLINE${mathInlines.length - 1}MATHINLINE`;
        });

        // 마크다운 파싱
        let parsedAnswer = marked.parse(answerText);

        // 수식 복원
        parsedAnswer = parsedAnswer.replace(/MATHBLOCK(\d+)MATHBLOCK/g, (match, index) => {
            return `\\[${mathBlocks[index]}\\]`;
        });
        parsedAnswer = parsedAnswer.replace(/MATHINLINE(\d+)MATHINLINE/g, (match, index) => {
            return `\\(${mathInlines[index]}\\)`;
        });

        const traceHtml = hasTrace
                ? `<details class="agent-trace" ${traceState.open ? 'open' : ''}>
                       <summary>생각의 과정</summary>
                       <div class="agent-trace-body">${marked.parse(parts.traceMarkdown)}</div>
                   </details>`
                : '';
        const answerHtml = hasAnswer
                ? `<div class="agent-answer">${parsedAnswer}</div>`
                : '';

        target.innerHTML = traceHtml + answerHtml;

        const summary = target.querySelector('.agent-trace > summary');
        if (summary) {
            summary.addEventListener('click', () => {
                traceState.userInteracted = true;
                setTimeout(() => {
                    const currentTrace = target.querySelector('.agent-trace');
                    if (currentTrace) traceState.open = currentTrace.open;
                }, 0);
            });
        }
    }

    function createStreamingMarkdownRenderer(target, onRendered) {
        let latestMarkdown = '';
        let renderedMarkdown = '';
        let scheduled = false;
        const traceState = {
            open: true,
            autoCollapsed: false,
            userInteracted: false
        };

        const renderNow = () => {
            scheduled = false;
            if (latestMarkdown === renderedMarkdown) return;
            renderedMarkdown = latestMarkdown;
            renderStreamMessage(target, renderedMarkdown, traceState);
            if (onRendered) onRendered();
        };

        return {
            push(markdownText) {
                latestMarkdown = markdownText;
                if (scheduled) return;
                scheduled = true;
                requestAnimationFrame(renderNow);
            },
            flush() {
                renderNow();
            }
        };
    }

    function addMsg(html, type) {
        const c = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerHTML = `
            <div class="avatar">${type === 'ai' ? '🤖' : '👤'}</div>
            <div class="bubble">${html}</div>
        `;
        c.appendChild(div);
        scrollToBottom();
        return div;
    }

    function scrollToBottom() {
        const c = document.getElementById('chat-container');
        c.scrollTop = c.scrollHeight;
    }

    async function sendMsg() {
        const inp = document.getElementById('prompt-input');
        const txt = inp.value.trim();
        if (!txt || streaming) return;

        addMsg(txt, 'user');
        inp.value = '';
        streaming = true;

        // STATUS: Sending
        StatusLayer.show('Sending message...');

        const aiMsg = addMsg('...', 'ai');
        const bubble = aiMsg.querySelector('.bubble');

        try {
            // STATUS: Thinking
            StatusLayer.update('Thinking...');

            let acc = '';
            const renderer = createStreamingMarkdownRenderer(bubble, scrollToBottom);

            if (transport === 'a2a-supervisor') {
                const reqId = `chat-${Date.now()}`;
                const res = await fetch(a2aEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: reqId,
                        method: 'message/stream',
                        params: { messageText: txt, model: selectedModelKey() }
                    })
                });
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status} ${res.statusText}`);
                }
                const contentType = (res.headers.get('content-type') || '').toLowerCase();
                if (!contentType.includes('text/event-stream')) {
                    const fallbackText = await res.text();
                    let errorMessage = fallbackText;
                    try {
                        const parsed = JSON.parse(fallbackText);
                        errorMessage = parsed?.error?.message || fallbackText;
                    } catch (ignored) {}
                    throw new Error(`Supervisor stream endpoint returned non-SSE response: ${errorMessage}`);
                }

                // STATUS: Receiving
                StatusLayer.update('Receiving response...');

                const reader = res.body.getReader();
                const dec = new TextDecoder();
                let sseBuffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    sseBuffer += dec.decode(value, { stream: true });
                    const frames = sseBuffer.split('\n\n');
                    sseBuffer = frames.pop() || '';

                    for (const frame of frames) {
                        const lines = frame.split('\n');
                        let eventName = 'message';
                        let data = '';
                        for (const line of lines) {
                            if (line.startsWith('event:')) {
                                eventName = line.slice(6).trim();
                            } else if (line.startsWith('data:')) {
                                data += line.slice(5).trim();
                            }
                        }
                        if (!data) continue;

                        if (eventName === 'chunk') {
                            let chunk = data;
                            try {
                                chunk = JSON.parse(data);
                            } catch (ignored) {}
                            acc += String(chunk);
                            renderer.push(acc);
                            continue;
                        }

                        if (eventName === 'error') {
                            try {
                                const parsed = JSON.parse(data);
                                const msg = parsed?.error?.message || parsed?.message || data;
                                acc += `\n\n[오류] ${msg}`;
                            } catch (ignored) {
                                acc += `\n\n[오류] ${data}`;
                            }
                            renderer.push(acc);
                            continue;
                        }

                        if (eventName === 'done') {
                            renderer.push(acc);
                        }
                    }
                }

                renderer.flush();
            } else {
                const res = await fetch(`${apiBase}/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: txt, model: selectedModelKey() })
                });

                // STATUS: Receiving
                StatusLayer.update('Receiving response...');

                const reader = res.body.getReader();
                const dec = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    acc += dec.decode(value, { stream: true });
                    renderer.push(acc);
                }

                const tail = dec.decode();
                if (tail) {
                    acc += tail;
                    renderer.push(acc);
                }
                renderer.flush();
            }

            // 스트리밍 완료 후 KaTeX와 Mermaid 렌더링
            console.log('Rendering math and mermaid...');

            try {
                renderMath(bubble);
                console.log('Math rendered');
            } catch (mathError) {
                console.error('Math render error:', mathError);
            }

            try {
                await renderMermaid(bubble);
                console.log('Mermaid rendered');
            } catch (mermaidError) {
                console.error('Mermaid render error:', mermaidError);
            }

            // STATUS: Complete
            StatusLayer.complete('Response Complete');
        } catch (e) {
            bubble.innerText = 'Error: ' + e.message;
            StatusLayer.complete('Error Occurred');
        } finally {
            streaming = false;
        }
    }

    // Status Layer Controller
    const StatusLayer = {
        el: null,
        textEl: null,
        init() {
            this.el = document.getElementById('status-layer');
            this.textEl = document.getElementById('status-text');
        },
        show(msg = 'Processing...') {
            if (!this.el) this.init();
            this.textEl.textContent = msg;
            this.el.classList.remove('complete');
            this.el.classList.add('active');
        },
        update(msg) {
            if (!this.el) this.init();
            this.textEl.textContent = msg;
        },
        complete(msg = 'Done') {
            if (!this.el) this.init();
            this.textEl.textContent = msg;
            this.el.classList.add('complete');
            setTimeout(() => {
                this.el.classList.remove('active', 'complete');
            }, 1500);
        }
    };

    async function clearSessionHistory() {
        if (!confirm('세션 히스토리를 삭제하시겠습니까?')) return;
        try {
            if (transport !== 'a2a-supervisor') {
                await fetch(`${apiBase}/clear`, { method: 'POST' });
            }
            const c = document.getElementById('chat-container');
            c.innerHTML = `
                <div class="message ai">
                    <div class="avatar">🤖</div>
                    <div class="bubble">${transport === 'a2a-supervisor' ? '대화 화면을 초기화했습니다.' : '세션 히스토리가 삭제되었습니다.'}</div>
                </div>`;
        } catch (e) {
            alert('히스토리 삭제 실패: ' + e.message);
        }
    }

    document.getElementById('send-btn').addEventListener('click', sendMsg);
    document.getElementById('clear-history-btn').addEventListener('click', clearSessionHistory);
    document.getElementById('prompt-input').addEventListener('keydown', (e) => {
        if (e.isComposing) return;
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    });

    // 페이지 로드 시 라이브러리 확인 및 초기 렌더링
    window.addEventListener('load', () => {
        console.log('=== Library Check ===');
        console.log('marked:', typeof marked !== 'undefined' ? '✓' : '✗');
        console.log('mermaid:', typeof mermaid !== 'undefined' ? '✓' : '✗');
        console.log('katex:', typeof katex !== 'undefined' ? '✓' : '✗');
        console.log('renderMathInElement:', typeof renderMathInElement !== 'undefined' ? '✓' : '✗');

        // 초기 메시지에 KaTeX 렌더링 적용
        const initialBubble = document.querySelector('.bubble');
        if (initialBubble && typeof renderMathInElement !== 'undefined') {
            console.log('Rendering initial math...');
            renderMath(initialBubble);
        }
    });
</script>
