<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A Supervisor Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="/libs/katex.min.css">
  <script src="/libs/katex.min.js"></script>
  <script src="/libs/auto-render.min.js"></script>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --surface-elevated: #ffffff;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
    }

    .app {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .top {
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border-light);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      box-shadow: var(--shadow-md);
      font-size: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-weight: 400;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button, input, textarea {
      font: inherit;
    }

    #model {
      border: 1px solid var(--border-medium);
      background: var(--bg-secondary);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 180px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    #model:hover {
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    #model:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      color: var(--text-primary);
      background: var(--bg-secondary);
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    .btn.main {
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      color: white;
      font-weight: 600;
      box-shadow: var(--shadow-md);
    }

    .btn.main:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: var(--shadow-lg);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .chat::-webkit-scrollbar {
      width: 10px;
    }

    .chat::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .chat::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 5px;
      border: 2px solid var(--bg-primary);
    }

    .chat::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .msg {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--bg-secondary);
      font-size: 20px;
      box-shadow: var(--shadow-sm);
    }

    .msg.user .avatar {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
    }

    .bubble {
      max-width: 100%;
      border-radius: 12px;
      padding: 18px 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      line-height: 1.7;
      font-size: 15px;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .user .bubble {
      background: var(--surface-elevated);
      border: 1px solid var(--accent-primary);
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.1), var(--shadow-sm);
    }

    .bubble p {
      margin: 0.5em 0;
    }

    .bubble pre {
      background: #f1f5f9;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      overflow-x: auto;
      padding: 16px;
      margin: 12px 0;
    }

    .bubble code {
      background: #f1f5f9;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 0.9em;
      font-family: "SF Mono", "Consolas", "Monaco", monospace;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
      border: none;
    }

    .supervisor-panel {
      margin-bottom: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-medium);
      background: #f8fafc;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .supervisor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .supervisor-title {
      font-size: 12px;
      color: var(--accent-primary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .supervisor-title::before {
      content: '⚙️';
      font-size: 16px;
    }

    .supervisor-toggle {
      border: 1px solid var(--border-medium);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 600;
    }

    .supervisor-toggle:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .supervisor-progress-bar {
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .supervisor-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 3px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .supervisor-progress-fill.completed {
      background: var(--success);
    }

    .supervisor-current-stage {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--bg-secondary);
      border-radius: 6px;
      border-left: 3px solid var(--accent-primary);
    }

    .supervisor-stream {
      max-height: 140px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      font-family: "SF Mono", "Consolas", "Monaco", monospace;
      background: var(--bg-secondary);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      scrollbar-width: thin;
      scrollbar-color: var(--border-medium) transparent;
    }

    .supervisor-stream::-webkit-scrollbar {
      width: 6px;
    }

    .supervisor-stream::-webkit-scrollbar-track {
      background: transparent;
    }

    .supervisor-stream::-webkit-scrollbar-thumb {
      background: var(--border-medium);
      border-radius: 3px;
    }

    .supervisor-stream:hover::-webkit-scrollbar-thumb {
      background: var(--text-muted);
    }

    .supervisor-panel.collapsed .supervisor-stream {
      display: none;
    }

    .supervisor-panel.collapsed .supervisor-progress-bar,
    .supervisor-panel.collapsed .supervisor-current-stage {
      display: block;
    }

    .assistant-answer:empty {
      min-height: 8px;
    }

    .review-panel {
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--warning);
      background: #fffbeb;
      display: none;
    }

    .review-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .review-title::before {
      content: '👤';
      font-size: 16px;
    }

    .review-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .review-progress {
      display: none;
      margin: 12px 0;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-light);
    }

    .review-progress.active {
      display: block;
    }

    .review-progress-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-progress-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-medium);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .review-progress-bar {
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .review-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s ease;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .review-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn.approve {
      background: var(--success);
      border: 1px solid var(--success);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .btn.approve:disabled,
    .btn.cancel:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn.approve:hover:not(:disabled) {
      background: #059669;
      border-color: #059669;
    }

    .btn.cancel {
      background: var(--error);
      border: 1px solid var(--error);
      color: white;
    }

    .btn.cancel:hover:not(:disabled) {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* Math Equations */
    .katex-display {
      margin: 16px 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 0;
    }

    .katex {
      font-size: 1.1em;
      color: var(--text-primary) !important;
    }

    .katex .base {
      color: var(--text-primary);
    }

    /* Inline math */
    .bubble p .katex {
      display: inline-block;
      vertical-align: middle;
    }

    /* Block math */
    .bubble .katex-display > .katex {
      display: block;
      text-align: center;
    }

    /* Markdown Lists */
    .bubble ul, .bubble ol {
      margin: 12px 0;
      padding-left: 24px;
    }

    .bubble ul {
      list-style-type: disc;
    }

    .bubble ol {
      list-style-type: decimal;
    }

    .bubble li {
      margin: 6px 0;
      line-height: 1.7;
    }

    /* Markdown Headings */
    .bubble h1, .bubble h2, .bubble h3,
    .bubble h4, .bubble h5, .bubble h6 {
      margin: 16px 0 8px 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .bubble h1 { font-size: 1.5em; }
    .bubble h2 { font-size: 1.3em; }
    .bubble h3 { font-size: 1.1em; }

    /* Markdown Blockquote */
    .bubble blockquote {
      margin: 12px 0;
      padding: 8px 16px;
      border-left: 3px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-secondary);
    }

    /* Markdown Tables */
    .bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }

    .bubble table th,
    .bubble table td {
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      text-align: left;
    }

    .bubble table th {
      background: rgba(0, 0, 0, 0.3);
      font-weight: 600;
    }

    .hint {
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-light);
      padding: 14px 32px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Status Progress Bar */
    #status-progress {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg,
        rgba(59, 130, 246, 0.08),
        rgba(139, 92, 246, 0.08));
      transition: width 0.3s ease;
      z-index: 0;
      opacity: 0;
    }

    #status-progress.active {
      opacity: 1;
    }

    #status {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .status-indicator.active {
      opacity: 1;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-indicator.streaming {
      background: var(--accent-primary);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }

    .status-indicator.complete {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
      animation: none;
    }

    .status-indicator.error {
      background: var(--error);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.7;
      }
    }

    .input {
      background: var(--surface-elevated);
      border-top: 1px solid var(--border-light);
      padding: 24px 32px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 1000px;
      margin: 0 auto;
    }

    #prompt {
      flex: 1;
      min-height: 56px;
      max-height: 200px;
      resize: vertical;
      border: 1px solid var(--border-medium);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text-primary);
      background: var(--bg-secondary);
      font-size: 15px;
      line-height: 1.5;
      transition: all 0.2s;
    }

    #prompt:focus {
      outline: none;
      border-color: var(--accent-primary);
      background: var(--bg-secondary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    #prompt::placeholder {
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .top {
        padding: 12px 16px;
      }

      .chat {
        padding: 20px 16px;
        gap: 16px;
      }

      .bubble {
        padding: 12px 16px;
        font-size: 14px;
      }

      .input {
        padding: 16px;
      }

      .input-row {
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 100%;
      }

      #model {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="title">
        <div class="logo">🤖</div>
        <div>
          <h1>A2A Supervisor</h1>
          <div class="subtitle">Enterprise AI Assistant • Real-time Streaming</div>
        </div>
      </div>
      <div class="tools">
        <select id="model">
          <option value="openai">OpenAI (default)</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="gemini">Gemini</option>
          <option value="gemini-lite">Gemini Lite</option>
          <option value="mistral">Mistral</option>
          <option value="mistral-large-latest">Mistral Large Latest</option>
        </select>
        <button class="btn" id="stopBtn">중지</button>
        <button class="btn" id="clearBtn">초기화</button>
        <a class="btn" href="/index.html">홈</a>
      </div>
    </header>

    <section id="chat" class="chat"></section>
    <div class="hint">
      <div id="status-progress"></div>
      <div id="status">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="status-text">준비됨</span>
      </div>
    </div>

    <section class="input">
      <div class="input-row">
        <textarea id="prompt" placeholder="메시지를 입력하세요... (Enter: 전송 / Shift+Enter: 줄바꿈)"></textarea>
        <button class="btn main" id="sendBtn">전송</button>
      </div>
    </section>
  </main>

  <script>
    marked.setOptions({
      gfm: true,
      breaks: true,
      pedantic: false,
      sanitize: false,
      smartLists: true,
      smartypants: false
    });
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    const endpoint = '/a2a/supervisor/stream';
    const chatEl = document.getElementById('chat');
    const statusTextEl = document.getElementById('status-text');
    const statusIndicatorEl = document.getElementById('status-indicator');
    const statusProgressEl = document.getElementById('status-progress');
    const promptEl = document.getElementById('prompt');
    const modelEl = document.getElementById('model');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const stopBtn = document.getElementById('stopBtn');

    let streaming = false;
    let abortController = null;

    function setStatus(text, type = 'ready') {
      statusTextEl.textContent = text;
      statusIndicatorEl.className = 'status-indicator';
      statusProgressEl.className = '';
      statusProgressEl.style.width = '0%';

      if (type === 'streaming') {
        statusIndicatorEl.classList.add('active', 'streaming');
        statusProgressEl.classList.add('active');
        statusProgressEl.style.width = '100%';
      } else if (type === 'complete') {
        statusIndicatorEl.classList.add('active', 'complete');
        statusProgressEl.style.width = '100%';
        setTimeout(() => {
          statusIndicatorEl.classList.remove('active', 'complete');
          statusProgressEl.style.width = '0%';
        }, 2000);
      } else if (type === 'error') {
        statusIndicatorEl.classList.add('active', 'error');
        statusProgressEl.style.width = '100%';
        setTimeout(() => {
          statusIndicatorEl.classList.remove('active', 'error');
          statusProgressEl.style.width = '0%';
        }, 3000);
      }
    }

    function addMessage(role, content) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.innerHTML = `
        <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble">${content}</div>
      `;
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return msg.querySelector('.bubble');
    }

    function createAiResponseShell() {
      const bubble = addMessage('ai', '');
      bubble.innerHTML = `
        <div class="supervisor-panel" style="display:none;">
          <div class="supervisor-head">
            <span class="supervisor-title">Supervisor Progress</span>
            <button class="supervisor-toggle" type="button">접기</button>
          </div>
          <div class="supervisor-progress-bar">
            <div class="supervisor-progress-fill" style="width: 0%"></div>
          </div>
          <div class="supervisor-current-stage"></div>
          <div class="supervisor-stream"></div>
        </div>
        <div class="review-panel">
          <div class="review-title">HITL 승인 대기</div>
          <div class="review-desc"></div>
          <div class="review-progress">
            <div class="review-progress-label">
              <div class="review-progress-spinner"></div>
              <span class="review-progress-text">처리 중...</span>
            </div>
            <div class="review-progress-bar">
              <div class="review-progress-fill"></div>
            </div>
          </div>
          <div class="review-actions">
            <button class="btn approve" type="button">승인(APPROVE)</button>
            <button class="btn cancel" type="button">취소(CANCEL)</button>
          </div>
        </div>
        <div class="assistant-answer"></div>
      `;

      const panel = bubble.querySelector('.supervisor-panel');
      const stream = bubble.querySelector('.supervisor-stream');
      const toggle = bubble.querySelector('.supervisor-toggle');
      const answer = bubble.querySelector('.assistant-answer');
      const progressFill = bubble.querySelector('.supervisor-progress-fill');
      const currentStage = bubble.querySelector('.supervisor-current-stage');
      const reviewPanel = bubble.querySelector('.review-panel');
      const reviewDesc = bubble.querySelector('.review-desc');
      const reviewProgress = bubble.querySelector('.review-progress');
      const reviewProgressText = bubble.querySelector('.review-progress-text');
      const reviewProgressFill = bubble.querySelector('.review-progress-fill');
      const approveBtn = bubble.querySelector('.btn.approve');
      const cancelBtn = bubble.querySelector('.btn.cancel');

      toggle.addEventListener('click', () => {
        panel.classList.toggle('collapsed');
        toggle.textContent = panel.classList.contains('collapsed') ? '펼치기' : '접기';
      });

      return {
        bubble, panel, stream, toggle, answer, progressFill, currentStage,
        reviewPanel, reviewDesc, reviewProgress, reviewProgressText, reviewProgressFill,
        approveBtn, cancelBtn
      };
    }

    function renderAssistantMarkdown(target, text) {
      // 수식을 임시 플레이스홀더로 보호
      let protectedText = text;
      const mathBlocks = [];
      const mathInlines = [];

      protectedText = protectedText.replace(/\\\[([\s\S]*?)\\\]/g, (match, content) => {
        mathBlocks.push(content);
        return `MATHBLOCK${mathBlocks.length - 1}MATHBLOCK`;
      });
      protectedText = protectedText.replace(/\$\$([\s\S]*?)\$\$/g, (match, content) => {
        mathBlocks.push(content);
        return `MATHBLOCK${mathBlocks.length - 1}MATHBLOCK`;
      });

      protectedText = protectedText.replace(/\\\((.*?)\\\)/g, (match, content) => {
        mathInlines.push(content);
        return `MATHINLINE${mathInlines.length - 1}MATHINLINE`;
      });
      protectedText = protectedText.replace(/\$([^\$\n]+?)\$/g, (match, content) => {
        mathInlines.push(content);
        return `MATHINLINE${mathInlines.length - 1}MATHINLINE`;
      });

      let parsedHtml = marked.parse(protectedText);

      parsedHtml = parsedHtml.replace(/MATHBLOCK(\d+)MATHBLOCK/g, (match, index) => {
        return `\\[${mathBlocks[index]}\\]`;
      });
      parsedHtml = parsedHtml.replace(/MATHINLINE(\d+)MATHINLINE/g, (match, index) => {
        return `\\(${mathInlines[index]}\\)`;
      });

      target.innerHTML = parsedHtml;
    }

    function parseSseFrames(buffer) {
      const normalized = buffer.replace(/\r\n/g, '\n');
      const chunks = normalized.split('\n\n');
      return {
        frames: chunks.slice(0, -1),
        rest: chunks[chunks.length - 1] || ''
      };
    }

    function parseFrame(frame) {
      const lines = frame.split('\n');
      let event = 'message';
      const dataLines = [];
      for (const line of lines) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
      }
      return { event, data: dataLines.join('\n') };
    }

    function normalizeNestedSse(event, data) {
      if (event !== 'message' || !data) {
        return { event, data };
      }

      if (data.startsWith('event:') || data.includes('\ndata:')) {
        const nested = parseFrame(data);
        if (nested.data) {
          return nested;
        }
      }

      // 서버 구현에 따라 plain message/data chunk만 내려오는 경우도 허용
      if (data === '[DONE]') {
        return { event: 'done', data: '{"reason":"completed"}' };
      }
      return { event: 'chunk', data };
    }

    // KaTeX 렌더링 함수
    function renderMath(element) {
      if (!element || !window.renderMathInElement) {
        console.warn('KaTeX not available');
        return;
      }
      try {
        renderMathInElement(element, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "\\[", right: "\\]", display: true},
            {left: "$", right: "$", display: false},
            {left: "\\(", right: "\\)", display: false}
          ],
          throwOnError: false
        });
        console.log('KaTeX rendered');
      } catch (e) {
        console.error('KaTeX render error:', e);
      }
    }

    // Mermaid 렌더링 함수
    async function renderMermaid(element) {
      if (!element) return;
      const mermaidBlocks = element.querySelectorAll('code.language-mermaid');
      for (let i = 0; i < mermaidBlocks.length; i++) {
        const code = mermaidBlocks[i].textContent;
        try {
          const id = `m-${Date.now()}-${i}`;
          const { svg } = await mermaid.render(id, code);
          const wrap = document.createElement('div');
          wrap.className = 'mermaid-diagram';
          wrap.innerHTML = svg;
          mermaidBlocks[i].parentElement.replaceWith(wrap);
          console.log('Mermaid rendered');
        } catch (e) {
          console.warn('Mermaid render error:', e);
        }
      }
    }

    async function enhanceBubble(bubble) {
      try {
        renderMath(bubble);
      } catch (e) {
        console.error('Math render error:', e);
      }

      try {
        await renderMermaid(bubble);
      } catch (e) {
        console.error('Mermaid render error:', e);
      }
    }

    /**
     * Supervisor 진행 상황 파싱 함수
     * 포맷: [supervisor] [stage] [progress%] message {metadata}
     */
    function parseSupervisorProgress(line) {
      // [supervisor] [stage] [progress%] message {key=value, ...}
      const pattern = /^\[supervisor\]\s+\[([^\]]+)\]\s+\[(\d+)%\]\s+(.+?)(?:\s+\{(.+)\})?$/;
      const match = line.match(pattern);

      if (!match) {
        return null;
      }

      const [, stage, progress, message, metadataStr] = match;
      const metadata = {};

      if (metadataStr) {
        // "key=value, key2=value2" 파싱
        metadataStr.split(',').forEach(pair => {
          const [key, value] = pair.trim().split('=');
          if (key && value) {
            metadata[key.trim()] = value.trim();
          }
        });
      }

      return {
        stage,
        progress: parseInt(progress, 10),
        message,
        metadata
      };
    }

    /**
     * 단계명을 한글 레이블로 변환
     */
    function getStageLabel(stage) {
      const labels = {
        initializing: '🚀 초기화',
        analyzing: '🔍 분석',
        planning: '📋 계획',
        hitl_waiting: '🧑 검토 대기',
        routing: '🎯 라우팅',
        invoking: '⚡ 실행',
        composing: '✨ 합성',
        completed: '✅ 완료',
        error: '❌ 오류'
      };
      return labels[stage] || stage;
    }

    async function rpcCall(method, params) {
      const body = {
        jsonrpc: '2.0',
        id: `ui-rpc-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        method,
        params
      };
      const res = await fetch('/a2a/supervisor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function findLatestWaitingTaskId() {
      const listRes = await rpcCall('tasks/list', { limit: 30 });
      const tasks = listRes?.result?.tasks || [];
      const waiting = tasks.find(t => t.status === 'WAITING_REVIEW');
      return waiting?.id || '';
    }

    async function handleReviewDecision(ai, taskId, decision) {
      // 버튼 비활성화
      ai.approveBtn.disabled = true;
      ai.cancelBtn.disabled = true;

      // 프로그레스 바 표시
      ai.reviewProgress.classList.add('active');
      ai.reviewProgressText.textContent = decision === 'APPROVE' ? '승인 처리 중...' : '취소 처리 중...';
      ai.reviewProgressFill.style.width = '30%';

      if (decision === 'APPROVE') {
        setStatus('승인 후 실행 시작...', 'streaming');
      }

      try {
        // 50% 진행
        ai.reviewProgressFill.style.width = '50%';

        const decideRes = await rpcCall('tasks/review/decide', {
          id: taskId,
          decision,
          reason: decision === 'APPROVE' ? 'approved_from_ui' : 'canceled_from_ui',
          decisionId: `ui-decision-${Date.now()}`
        });

        // 70% 진행
        ai.reviewProgressFill.style.width = '70%';

        if (decideRes?.error) {
          ai.reviewProgress.classList.remove('active');
          ai.reviewDesc.textContent = `결정 실패: ${decideRes.error.message || 'unknown error'}`;
          ai.approveBtn.disabled = false;
          ai.cancelBtn.disabled = false;
          return;
        }

        const task = decideRes?.result?.task;
        const review = decideRes?.result?.review;

        // 90% 진행
        ai.reviewProgressFill.style.width = '90%';
        ai.reviewProgressText.textContent = '결과 처리 중...';

        ai.reviewDesc.textContent = `결정 완료: ${review?.status || decision}`;
        if (task?.response) {
          const parsed = splitSupervisorPayload(String(task.response));
          if (parsed.logs.length > 0) {
            ai.panel.style.display = 'block';
            ai.panel.classList.remove('collapsed');
            ai.toggle.textContent = '접기';
            await replaySupervisorLogs(ai, parsed.logs);
          }
          if (parsed.answer.trim().length > 0) {
            renderAssistantMarkdown(ai.answer, parsed.answer.trim());
            await enhanceBubble(ai.answer);
          }
        } else if (decision === 'CANCEL') {
          renderAssistantMarkdown(ai.answer, '요청이 검토 단계에서 취소되었습니다.');
        }

        // 100% 완료
        ai.reviewProgressFill.style.width = '100%';
        ai.reviewProgressText.textContent = '완료';

        // 1초 후 프로그레스 바 숨기기
        setTimeout(() => {
          ai.reviewProgress.classList.remove('active');
          ai.approveBtn.style.display = 'none';
          ai.cancelBtn.style.display = 'none';
        }, 1000);

        setStatus(`Review ${decision} 완료`, 'complete');
      } catch (e) {
        ai.reviewProgress.classList.remove('active');
        ai.reviewDesc.textContent = `결정 처리 실패: ${e.message}`;
        ai.approveBtn.disabled = false;
        ai.cancelBtn.disabled = false;
      }
    }

    function splitSupervisorPayload(payload) {
      const lines = String(payload || '').split('\n');
      const logs = [];
      const answerLines = [];
      for (const raw of lines) {
        const line = raw.trimEnd();
        if (line.trim().startsWith('[supervisor]')) {
          logs.push(line.trim());
        } else {
          answerLines.push(raw);
        }
      }
      return {
        logs,
        answer: answerLines.join('\n')
      };
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function replaySupervisorLogs(ai, logs) {
      ai.stream.textContent = '';
      ai.progressFill.classList.remove('completed');
      let lastProgress = 0;

      for (const line of logs) {
        ai.stream.textContent += (ai.stream.textContent ? '\n' : '') + line;
        ai.stream.scrollTop = ai.stream.scrollHeight;

        const progress = parseSupervisorProgress(line);
        if (progress) {
          const pct = Math.max(lastProgress, Math.min(100, progress.progress));
          lastProgress = pct;
          ai.progressFill.style.width = `${pct}%`;
          ai.currentStage.textContent = `${getStageLabel(progress.stage)} - ${progress.message}`;
          statusProgressEl.classList.add('active');
          statusProgressEl.style.width = `${pct}%`;
          statusTextEl.textContent = `${getStageLabel(progress.stage)} (${pct}%)`;
          statusIndicatorEl.className = 'status-indicator active streaming';
          if (pct >= 100 || progress.stage === 'completed') {
            ai.progressFill.classList.add('completed');
            statusIndicatorEl.className = 'status-indicator active complete';
            statusProgressEl.classList.remove('active');
          }
        }
        await sleep(90);
      }
    }

    async function showHitlReviewPanel(ai, reason) {
      const taskId = await findLatestWaitingTaskId();
      if (!taskId) {
        ai.reviewPanel.style.display = 'block';
        ai.reviewDesc.textContent = '리뷰 대기 task를 찾지 못했습니다. 잠시 후 다시 시도해주세요.';
        ai.approveBtn.disabled = true;
        ai.cancelBtn.disabled = true;
        return;
      }
      ai.reviewPanel.style.display = 'block';
      ai.reviewDesc.textContent = `taskId=${taskId}${reason ? `, reason=${reason}` : ''}`;
      ai.approveBtn.style.display = '';
      ai.cancelBtn.style.display = '';
      ai.approveBtn.disabled = false;
      ai.cancelBtn.disabled = false;
      ai.approveBtn.onclick = () => handleReviewDecision(ai, taskId, 'APPROVE');
      ai.cancelBtn.onclick = () => handleReviewDecision(ai, taskId, 'CANCEL');
    }

    async function send() {
      if (streaming) return;
      const text = promptEl.value.trim();
      if (!text) return;

      addMessage('user', text.replace(/\n/g, '<br>'));
      promptEl.value = '';
      streaming = true;
      abortController = new AbortController();
      setStatus('전송 중...', 'streaming');

      const ai = createAiResponseShell();
      let acc = '';
      const supervisorLogs = [];
      let lineBuffer = '';
      let answerStarted = false;
      let lastProgress = 0;
      let waitingReviewDetected = false;
      let streamedAnswer = '';
      let pendingChars = '';
      let typewriterRunning = false;

      const pumpTypewriter = async () => {
        if (typewriterRunning) return;
        typewriterRunning = true;
        while (pendingChars.length > 0) {
          const batchSize = Math.min(6, pendingChars.length);
          const batch = pendingChars.slice(0, batchSize);
          pendingChars = pendingChars.slice(batchSize);
          streamedAnswer += batch;
          renderAssistantMarkdown(ai.answer, streamedAnswer);
          renderMath(ai.answer);
          chatEl.scrollTop = chatEl.scrollHeight;
          await sleep(8);
        }
        typewriterRunning = false;
      };

      const enqueueAssistantChars = (text) => {
        if (!text) return;
        pendingChars += text;
        void pumpTypewriter();
      };

      try {
        const requestId = `ui-${Date.now()}`;
        const payload = {
          jsonrpc: '2.0',
          id: requestId,
          method: 'message/stream',
          params: {
            messageText: text,
            model: modelEl.value || 'openai'
          }
        };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'text/event-stream'
          },
          body: JSON.stringify(payload),
          signal: abortController.signal
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`HTTP ${res.status}: ${err}`);
        }

        const contentType = (res.headers.get('content-type') || '').toLowerCase();
        if (!contentType.includes('text/event-stream')) {
          const body = await res.text();
          throw new Error(`Non-SSE response: ${body}`);
        }

        setStatus('응답 수신 중...', 'streaming');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parsed = parseSseFrames(buffer);
          buffer = parsed.rest;

          for (const frame of parsed.frames) {
            const parsedOuter = parseFrame(frame);
            const { event, data } = normalizeNestedSse(parsedOuter.event, parsedOuter.data);
            if (!data) continue;

            if (event === 'chunk') {
              let chunk = data;
              try { chunk = JSON.parse(data); } catch (e) {}
              lineBuffer += String(chunk);
              const lines = lineBuffer.split('\n');
              const trailing = lines.pop() || '';
              lineBuffer = '';

              let assistantDelta = '';
              for (const rawLine of lines) {
                const line = rawLine.trimEnd();
                if (line.trim().startsWith('[supervisor]')) {
                  supervisorLogs.push(line.trim());

                  // 진행 상황 파싱 및 UI 업데이트
                  const progress = parseSupervisorProgress(line.trim());
                    if (progress) {
                    // 진행률 업데이트
                    ai.progressFill.style.width = `${progress.progress}%`;
                    lastProgress = progress.progress;

                    // 100% 완료 시 시각적 피드백
                    if (progress.progress >= 100) {
                      ai.progressFill.classList.add('completed');
                      // 완료되면 panel은 접힌 상태로 유지 (사라지지 않음)
                    }

                    // 현재 단계 표시
                      ai.currentStage.textContent = `${getStageLabel(progress.stage)} - ${progress.message}`;
                      if (progress.stage === 'hitl_waiting') {
                        waitingReviewDetected = true;
                        await showHitlReviewPanel(ai, progress.message);
                      }

                    // 하단 상태바 업데이트
                    setStatus(`${getStageLabel(progress.stage)} (${progress.progress}%)`,
                              progress.progress >= 100 ? 'complete' : 'streaming');
                  }
                } else if (line.length > 0) {
                  assistantDelta += rawLine + '\n';
                }
              }

              if (trailing.length > 0) {
                if (trailing.trim().startsWith('[supervisor]')) {
                  lineBuffer = trailing;
                } else {
                  assistantDelta += trailing;
                }
              }

              if (supervisorLogs.length > 0) {
                ai.panel.style.display = 'block';
                ai.stream.textContent = supervisorLogs.join('\n');

                // 스트림을 최하단으로 자동 스크롤
                ai.stream.scrollTop = ai.stream.scrollHeight;
              }

              if (assistantDelta.length > 0) {
                if (!answerStarted) {
                  answerStarted = true;
                  ai.panel.classList.add('collapsed');
                  ai.toggle.textContent = '펼치기';
                }
                acc += assistantDelta;
                enqueueAssistantChars(assistantDelta);
              }

              chatEl.scrollTop = chatEl.scrollHeight;
              continue;
            }

            if (event === 'error') {
              let msg = data;
              try {
                const parsedErr = JSON.parse(data);
                msg = parsedErr?.error?.message || parsedErr?.message || data;
              } catch (e) {}
              const errorDelta = `\n\n[오류] ${msg}`;
              acc += errorDelta;
              enqueueAssistantChars(errorDelta);
              continue;
            }

            if (event === 'done') {
              setStatus('완료', 'complete');
            }
          }
        }

        const remainder = lineBuffer;
        const trimmedRemainder = remainder.trim();
        if (trimmedRemainder.startsWith('[supervisor]')) {
          supervisorLogs.push(trimmedRemainder);
          ai.panel.style.display = 'block';
          ai.stream.textContent = supervisorLogs.join('\n');
        } else if (remainder.length > 0) {
          acc += remainder;
          enqueueAssistantChars(remainder);
        }

        while (typewriterRunning || pendingChars.length > 0) {
          await sleep(10);
        }

        if (!acc) {
          if (waitingReviewDetected) {
            ai.answer.innerText = '요청이 HITL 승인 대기 상태입니다. 아래 버튼으로 승인/취소를 선택하세요.';
            setStatus('HITL 대기 중', 'streaming');
          } else {
            ai.answer.innerText = '[응답 없음] 스트림에서 chunk를 받지 못했습니다.';
            setStatus('응답 없음', 'error');
          }
        } else {
          renderAssistantMarkdown(ai.answer, acc);
          await enhanceBubble(ai.answer);
          setStatus('완료', 'complete');
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          setStatus('중지됨', 'ready');
          if (!acc) ai.answer.innerText = '[중단됨]';
        } else {
          ai.answer.innerText = `오류: ${e.message}`;
          setStatus(`오류: ${e.message}`, 'error');
        }
      } finally {
        streaming = false;
        abortController = null;
      }
    }

    sendBtn.addEventListener('click', send);
    stopBtn.addEventListener('click', () => {
      if (abortController) abortController.abort();
    });
    clearBtn.addEventListener('click', async () => {
      try {
        if (abortController) abortController.abort();
        await fetch('/a2a/supervisor/clear', { method: 'POST' });
        chatEl.innerHTML = '';
        setStatus('초기화됨', 'ready');
        addMessage('ai', '세션 히스토리를 초기화했습니다.');
      } catch (e) {
        setStatus(`초기화 실패: ${e.message}`, 'error');
      }
    });
    promptEl.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    addMessage('ai', '안녕하세요. A2A Supervisor에 오신 것을 환영합니다. 무엇을 도와드릴까요?');

    // 페이지 로드 시 라이브러리 확인
    window.addEventListener('load', () => {
      console.log('=== Library Check ===');
      console.log('marked:', typeof marked !== 'undefined' ? '✓' : '✗');
      console.log('mermaid:', typeof mermaid !== 'undefined' ? '✓' : '✗');
      console.log('katex:', typeof katex !== 'undefined' ? '✓' : '✗');
      console.log('renderMathInElement:', typeof renderMathInElement !== 'undefined' ? '✓' : '✗');
    });
  </script>
