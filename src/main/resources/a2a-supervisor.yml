host:
  a2a:
    routing:
      product:
        endpoint: ${SUPERVISOR_PRODUCT_A2A_ENDPOINT:http://localhost:8082/a2a/product}
        method: message/send
        timeout-ms: 120000
      reservation:
        endpoint: ${SUPERVISOR_RESERVATION_A2A_ENDPOINT:http://localhost:8082/a2a/reservation}
        method: message/send
        timeout-ms: 120000
      search:
        endpoint: ${SUPERVISOR_SEARCH_A2A_ENDPOINT:http://localhost:8082/a2a/search}
        method: message/send
        timeout-ms: 120000
      mygenie:
        endpoint: ${MYGENIE_A2A_ENDPOINT:http://localhost:8001/a2a}
        method: message/send
        timeout-ms: 1200000
    retry:
      max-retries: 0
      initial-backoff-ms: 500
      max-backoff-ms: 3000
    circuit-breaker:
      enabled: true
      failure-threshold: 3
      open-duration-ms: 30000
    execution:
      # 1이면 순차, 2 이상이면 최대 동시 호출 수
      max-concurrency: 2
    handoff:
      enabled: true
      max-hops: 3
      block-same-agent-within-steps: 2
      max-per-minute: 10
      allow-methods:
        - message/send
        - SendMessage
        - message/stream
        - SendStreamingMessage
    stream:
      timeout-ms: 120000
